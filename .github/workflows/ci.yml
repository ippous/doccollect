name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restauration
        run: dotnet restore DocCollect.slnx
      - name: Compilation
        run: dotnet build DocCollect.slnx -c Release --no-restore
      - name: Tests
        run: dotnet test DocCollect.slnx -c Release --no-build --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
