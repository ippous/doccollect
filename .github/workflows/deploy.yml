# Déploiement continu sur le VPS Hostinger.
#   push sur develop          → environnement dev   (doccollect-dev.jaume-eric.com)
#   push sur main             → environnement test  (doccollect-test.jaume-eric.com)
#   publication d'une release → environnement prod  (doccollect.jaume-eric.com), avec approbation manuelle
#
# Secrets du dépôt : VPS_HOST, VPS_USER, VPS_SSH_KEY (clé privée d'un utilisateur de déploiement membre du groupe docker).
# Environnements GitHub : dev, test, prod (ajouter une règle « Required reviewers » sur prod).
name: Deploy

on:
  push:
    branches: [develop, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        required: true
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  packages: write

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
      version: ${{ steps.pick.outputs.version }}
      enabled: ${{ steps.pick.outputs.enabled }}
    steps:
      - id: pick
        env:
          HAS_VPS: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
        run: |
          # Tant que les secrets du VPS ne sont pas configurés, le déploiement est ignoré (pas d'échec).
          echo "enabled=$HAS_VPS" >> "$GITHUB_OUTPUT"
          [ "$HAS_VPS" = "true" ] || echo "::notice::Secrets VPS_HOST / VPS_SSH_KEY absents : déploiement ignoré (voir docs/dev/deployment.md)."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ENV="${{ inputs.environment }}";
          elif [ "${{ github.event_name }}" = "release" ]; then ENV=prod;
          elif [ "${{ github.ref_name }}" = "main" ]; then ENV=test;
          else ENV=dev; fi
          if [ "${{ github.event_name }}" = "release" ]; then VERSION="${{ github.event.release.tag_name }}"; VERSION="${VERSION#v}";
          else VERSION="0.1.${{ github.run_number }}"; fi
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    needs: target
    if: needs.target.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test DocCollect.slnx -c Release

  image:
    needs: [target, test]
    if: needs.target.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ needs.target.outputs.version }}
          tags: |
            ghcr.io/ippous/doccollect:${{ needs.target.outputs.env }}
            ghcr.io/ippous/doccollect:${{ needs.target.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [target, image]
    if: needs.target.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.target.outputs.env }}
      url: ${{ needs.target.outputs.env == 'prod' && 'https://doccollect.jaume-eric.com' || format('https://doccollect-{0}.jaume-eric.com', needs.target.outputs.env) }}
    steps:
      - uses: actions/checkout@v4
      - name: Copie du fichier compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: /opt/doccollect/${{ needs.target.outputs.env }}
          strip_components: 1
      - name: Mise à jour des conteneurs
        uses: appleboy/ssh-action@v1.2.0
        env:
          DC_ENV: ${{ needs.target.outputs.env }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DC_ENV
          script: |
            set -e
            cd /opt/doccollect/$DC_ENV
            PROFILE=""; [ "$DC_ENV" != "prod" ] && PROFILE="--profile mailpit"
            docker compose --env-file .env $PROFILE pull
            docker compose --env-file .env $PROFILE up -d --remove-orphans
            # Sonde de santé (via le réseau interne du projet)
            for i in $(seq 1 30); do
              if docker run --rm --network doccollect-${DC_ENV}_internal curlimages/curl -fsS http://app:8080/healthz >/dev/null 2>&1; then
                echo "Santé OK"; exit 0; fi
              sleep 5
            done
            echo "L'application ne répond pas" && docker compose --env-file .env logs --tail=100 app && exit 1
